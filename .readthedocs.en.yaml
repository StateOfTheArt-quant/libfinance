# Read the Docs configuration — **English docs**
#
# See the comment in .readthedocs.yaml for how the two projects are wired
# together. This file is not picked up automatically: the English project must
# point at it under Admin → Settings → "Build configuration file".
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/en/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
