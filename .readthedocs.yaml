# Read the Docs 配置 —— **中文文档**（父项目）
#
# 中英文是两棵独立的源码树，Read the Docs 要求一个语言一个项目，所以这里有两份配置：
#
#   .readthedocs.yaml      中文，项目语言设为 zh-cn（父项目，用默认路径）
#   .readthedocs.en.yaml   英文，项目语言设为 en
#
# 英文项目要在它的 Admin → Settings → "Build configuration file" 里把路径指向
# .readthedocs.en.yaml，再到中文项目的 Admin → Translations 里把它挂为翻译项目；
# 挂上之后 flyout 菜单里就有语言切换。
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/zh/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
