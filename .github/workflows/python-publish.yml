# Publish the Python client to PyPI when a GitHub Release is published.
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# Release: bump VERSION (the one version of the C++ and Python clients), merge, then publish a GitHub
# Release whose tag is v<VERSION>. The upload uses PyPI trusted publishing (no token): the PyPI project
# libfinance lists this repository, this workflow (python-publish.yml) and the environment `pypi`.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and test the distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: The tag is the repository version
      run: |
        test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "::error::tag ${GITHUB_REF_NAME} is not v$(cat VERSION) (VERSION)"; exit 1; }
    - name: Build a wheel and a source tarball
      run: |
        python3 -m pip install build twine
        python3 -m build python --outdir dist/
        python3 -m twine check --strict dist/*
    - name: Test the built wheel
      run: |
        python3 -m pip install dist/*.whl pytest
        test "$(python3 -c 'import libfinance; print(libfinance.__version__)')" = "$(cat VERSION)"
        # tests that need a server skip themselves; nothing listens here
        LIBFINANCE_HOST=127.0.0.1 LIBFINANCE_PORT=1 python3 -m pytest -q python/test
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/libfinance
    permissions:
      id-token: write  # trusted publishing
    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
